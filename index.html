<!DOCTYPE html>
<html lang="de">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fokus11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fokus11 – Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#16a34a; --accent-d:#15803d; --accent-l:#dcfce7; --accent-ll:#f0fdf4;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0;
  --bg:#eef2f0; --card:#fff; --warn:#b45309; --warn-l:#fef3c7; --info:#0369a1; --info-l:#e0f2fe;
  --c-md:#0f172a; --c-md1:#d97706; --c-mdp1:#0284c7; --c-team:#4f46e5; --c-extra:#16a34a; --c-rest:#94a3b8;
  --i1:#22c55e; --i2:#f59e0b; --i3:#ef4444;
  --r:18px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
  --head:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:#d9e2dd;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.phone{position:relative;width:100%;max-width:400px;height:100%;max-height:860px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,23,42,.25)}
@media (min-width:440px){.phone{border-radius:34px;border:8px solid #0f172a;height:calc(100% - 32px)}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;background:var(--bg)}
.logo{font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.logo b{color:var(--accent)}
.badge{font-size:11px;font-weight:600;background:#fde68a;color:#78350f;border-radius:999px;padding:3px 8px}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px;scroll-behavior:auto;overscroll-behavior:contain}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px max(8px,env(safe-area-inset-bottom))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent-d)}
.tab[aria-selected="true"] .ti{background:var(--accent-l)}
.ti{padding:3px 14px;border-radius:999px;display:flex;transition:background .2s}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;font-weight:700;font-size:15px;background:var(--accent);color:#fff;transition:transform .1s,background .2s}
.btn:hover:not(:disabled){background:var(--accent-d)}
.btn.sec:hover:not(:disabled){background:#bbf7d0}
.btn.ghost:hover:not(:disabled){background:#f1f5f9}
.btn.dark:hover:not(:disabled){background:#1e293b}
.btn.danger:hover:not(:disabled){background:#fecaca}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.block{width:100%}
.btn.sec{background:var(--accent-l);color:var(--accent-d)}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--accent-d);font-weight:700;min-height:44px;padding:0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:var(--ink2);text-transform:none}
.tag.adj{background:#fef3c7;color:#92400e}
.tag.now{background:var(--ink);color:#fff}
.tag.ok{background:var(--accent-l);color:var(--accent-d)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.i1{background:var(--i1)}.i2{background:var(--i2)}.i3{background:var(--i3)}
.daycard{color:#fff;border-radius:var(--r);padding:18px;margin-top:12px;position:relative;overflow:hidden}
.daycard .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.85}
.daycard h2{font-size:30px;font-weight:800;margin-top:2px}
.daycard p{margin:6px 0 0;opacity:.95;font-size:14px}
.daycard svg.deco{position:absolute;right:-18px;bottom:-22px;width:120px;height:120px;opacity:.18}
.t-MD{background:linear-gradient(135deg,#0f172a,#1e293b)}
.t-MD-1{background:linear-gradient(135deg,#d97706,#f59e0b)}
.t-MDp1{background:linear-gradient(135deg,#0284c7,#38bdf8)}
.t-TEAM{background:linear-gradient(135deg,#4338ca,#6366f1)}
.t-EXTRA{background:linear-gradient(135deg,#15803d,#22c55e)}
.t-REST{background:linear-gradient(135deg,#64748b,#94a3b8)}
.drill{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.drill:first-child{border-top:0}
.drill .nm{font-weight:600}
.drill .meta{font-size:13px;color:var(--muted)}
.drill .mn{margin-left:auto;font-weight:700;font-size:14px;white-space:nowrap}
.banner{border-radius:16px;padding:14px;margin-top:12px;display:flex;gap:12px;align-items:flex-start}
.banner.chg{background:#fffbeb;border:1.5px solid #fcd34d}
.banner.info{background:var(--info-l);border:1.5px solid #7dd3fc}
.banner.calm{background:#f0f9ff;border:1.5px solid #bae6fd}
.banner.grow{background:#f5f3ff;border:1.5px solid #c4b5fd}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner li{margin:3px 0;font-size:14px}
.banner .ic{flex:none;width:28px;height:28px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minis .card{margin-top:12px}
.big{font-family:var(--head);font-size:26px;font-weight:800}
/* week */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
@media (max-width:360px){.strip{gap:3px}.sd .ty{font-size:8px;padding:2px 1px;letter-spacing:0}}
.sd{background:#fff;border:2px solid transparent;border-radius:14px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;box-shadow:var(--shadow)}
.sd.today{border-color:var(--ink)}
.sd .d{font-weight:700;font-size:13px}
.sd .ty{font-size:9.5px;font-weight:800;padding:2px 4px;border-radius:6px;color:#fff;letter-spacing:.2px}
.sd .bars{display:flex;flex-direction:column-reverse;gap:2px;margin-top:auto}
.sd .bars i{display:block;width:18px;height:6px;border-radius:3px;background:#e2e8f0}
.sd .bars i.on{background:var(--ink2)}
.sd .adjdot{width:7px;height:7px;border-radius:50%;background:#f59e0b}
.bg-MD{background:var(--c-md)}.bg-MD-1{background:var(--c-md1)}.bg-MDp1{background:var(--c-mdp1)}.bg-TEAM{background:var(--c-team)}.bg-EXTRA{background:var(--c-extra)}.bg-REST{background:var(--c-rest)}
.wrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-radius:16px;padding:12px;margin-top:10px;box-shadow:var(--shadow);min-height:64px}
.wrow .bar{width:6px;align-self:stretch;border-radius:4px}
.wrow .t{font-weight:700}
.load{display:flex;gap:3px}
.load i{width:14px;height:8px;border-radius:3px;background:#e2e8f0;display:block}
.load.l1 i:nth-child(1){background:var(--i1)}
.load.l2 i:nth-child(-n+2){background:var(--i2)}
.load.l3 i{background:var(--i3)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* overlays */
.ov{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.ov.anim{animation:slide .22s ease-out}
.ov header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.ov header h2{flex:1}
.ov .body{flex:1;overflow-y:auto;padding:4px 16px 24px}
.ov footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
@keyframes slide{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.dlgwrap{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:#fff;border-radius:20px;padding:20px;width:100%;animation:pop .18s ease-out}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:50;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;animation:pop .2s ease-out;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* forms */
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=email],input[type=number]{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;width:100%;text-align:left;min-height:48px}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center}
.check[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.dots{display:flex;gap:6px;justify-content:center;padding:6px 0}
.dots i{width:8px;height:8px;border-radius:999px;background:#cbd5e1;transition:width .2s}
.dots i.on{width:22px;background:var(--accent)}
.wkrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.wkrow:first-child{border-top:0}
.wkrow .wd{width:30px;font-weight:700}
.seg{display:flex;gap:4px;margin-left:auto}
.seg button{min-width:44px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tog{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:12px;padding:0 10px}
.tog[aria-pressed="true"]{background:var(--c-team);color:#fff;border-color:var(--c-team)}
/* check-in */
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:17px}
.rpe button[aria-pressed="true"]{color:#fff;border-color:transparent}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.faces button{min-height:64px;border-radius:14px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;gap:2px}
.faces button svg{width:30px;height:30px}
.faces button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-ll);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.opt3 button,.opt2 button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.opt3 button[aria-pressed="true"],.opt2 button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:700}
.stepper output{font-family:var(--head);font-size:26px;font-weight:800;min-width:72px;text-align:center}
.q{margin-top:18px}
.q>.ql{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;column-gap:10px;justify-content:space-between;align-items:baseline}
.q>.ql small{color:var(--muted);font-weight:600}
.ddr{padding:10px 0;border-top:1px solid var(--line)}
.ddr:first-of-type{border-top:0}
/* session */
.timer{font-family:var(--head);font-size:72px;font-weight:800;text-align:center;letter-spacing:1px;margin:10px 0 0;font-variant-numeric:tabular-nums}
.prog{height:6px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.result-hero{text-align:center;padding:18px 0 6px}
.result-hero svg{width:72px;height:72px}
.chglist{list-style:none;margin:0;padding:0}
.chglist li{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.chglist li:first-child{border-top:0}
.chglist .ci{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
/* food */
.plate{display:flex;gap:14px;align-items:center}
.plate svg{width:150px;height:150px;flex:none}
.lg{display:flex;flex-direction:column;gap:8px;font-size:14px}
.lg>span{display:flex;gap:8px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.meal{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.meal:first-child{border-top:0}
.tabs2{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e2e8f0;padding:4px;border-radius:14px;margin-top:12px}
.tabs2 button{min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:700;font-size:14px}
.tabs2 button[aria-selected="true"]{background:#fff;box-shadow:var(--shadow)}
/* profile */
.avatar{width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:24px;font-weight:800}
.switch::before{content:"";position:absolute;inset:-8px -4px}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:#cbd5e1;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:24px}
.parentview{background:#fff;border:2px dashed #a5b4fc;border-radius:var(--r);padding:16px;margin-top:12px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv b{font-weight:700}
.disabledcard{opacity:.7;border:1.5px dashed #cbd5e1;box-shadow:none;background:#f8fafc}
.demo button{margin-top:8px}
.legal{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 6px}
.ob{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ob .body{flex:1;overflow-y:auto;padding:8px 20px 20px}
.ob footer{padding:12px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px}
.hero{background:linear-gradient(160deg,#14532d,#16a34a 60%,#4ade80);color:#fff;border-radius:24px;padding:26px 20px;margin-top:8px;position:relative;overflow:hidden}
.hero h1{font-size:40px}
.hero p{opacity:.95}
.note{font-size:13px;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.t-BLOCK{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.t-RECOVER{background:linear-gradient(135deg,#4d7c0f,#84cc16)}
.bg-BLOCK{background:#0d9488}.bg-RECOVER{background:#65a30d}
.chip.sm{min-height:44px;padding:0 12px;font-size:13px}
.chip .bd{font-size:10.5px;font-weight:800;background:#ffffff38;border-radius:999px;padding:2px 7px;margin-left:2px}
.chip.main{background:#14532d;border-color:#14532d}
.tipline{background:var(--accent-ll);border:1.5px solid #bbf7d0;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#166534;font-weight:600}
.tag.wf{background:#ede9fe;color:#5b21b6;margin-top:3px}
.wfline{margin:2px 0 0;color:#5b21b6;font-weight:700}
.illu{width:100%;height:auto;display:block;border-radius:12px}
.vid{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#0f172a,#334155);color:#fff;border-radius:14px;padding:14px;margin-top:12px;position:relative;font-size:13.5px;line-height:1.35}
.vid svg{flex:none}.vid span{opacity:.9}.vid .tag.ph{position:absolute;top:8px;right:8px;background:#fde68a;color:#78350f;opacity:1}
.dd{padding:12px 0;border-top:1px solid var(--line)}.dd:first-of-type{border-top:0}
.dd .nm{font-weight:600}.dd .meta{font-size:13px;color:var(--muted)}.dd .mn{font-weight:700;font-size:14px;white-space:nowrap}
.ci-card{border:2px solid var(--ink)}
.plain{margin:0;padding-left:18px}.plain li{margin:4px 0;font-size:14px}
.banner.soft{background:#eef2ff;border:1.5px solid #c7d2fe;margin-top:10px;font-size:14px}
.banner.demo-b{background:#fef9c3;border:1.5px dashed #ca8a04;align-items:center;font-size:13.5px;padding:6px 12px;flex-wrap:wrap}
.mgrid{display:flex;flex-direction:column;gap:4px}
.mrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mh{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.mc{position:relative;min-height:48px;border:0;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;box-shadow:var(--shadow)}
.mc .n{font-weight:700;font-size:14px}
.mc .mdot{width:16px;height:5px;border-radius:3px;display:block}
.mc.out{opacity:.45}
.mc.today{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.mc.mc-MD{background:#0f172a;color:#fff}.mc.mc-MD .mdot{background:#fff}
.mc .mck{position:absolute;top:2px;right:4px;font-size:10px;color:var(--accent-d);font-weight:800}
.mc.mc-MD .mck{color:#86efac}
.tl{position:relative;margin-top:12px;padding-bottom:4px}
.tlbar{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px}
.tlnow{position:absolute;top:-5px;width:4px;height:32px;background:var(--ink);border-radius:2px;transform:translateX(-2px);box-shadow:0 0 0 2px #fff}

<script id="engine">
/*
 * Fokus11 Adaptation Engine (v3)
 * ------------------------------
 * Pure functions, no DOM; every mutating function works on a clone and

 *
 * 1. Season & week: phaseOf() (Sommerpause, Vorbereitung, Hinrunde, Winterpause,
 *    Rückrunde; breaks = 3-week focus blocks, no match/team days). In season,
 *    days relative to the match day: MD, MD+1, MD-1, TEAM, EXTRA, REST.
 *    Caps: MD-1 2, MD+1 1 (2 only for the Ausgleich after < 30 min / not played),
 *    TEAM-extra 2, EXTRA/BLOCK 3 → MD±1 never high intensity (3).
 * 2. Every Zusatz session (and the MD+1 Ausgleich) starts with 8–10 min
 *    "Aufwärmen & Stabilität" (bodyweight). Rest days offer optional Basics.
 * 3. Focus weighting 50/25/25 (Haupt/Neben); weak-foot ≈ 20 %; positions.
 * 4. Feedback rhythm: post-session = Anstrengung + new drills only;
 *    Morgen-Check (feel/sleep/soreness) after training or match days;
 *    Spiel-Feedback after a match; Wochenrückblick on Monday.
 *    Pain, illness and holidays are never asked, always reportable.
 * 5. Speed of change: IMMEDIATE for pain (region-specific sparing, 3 days),
 *    illness/holiday (no sessions; after illness 3 lighter days) and match
 *    minutes (MD+1 recommendation). LOAD signals (Anstrengung ≥ personal
 *    normal+2 or ≥ 8, Muskelkater stark, Schlaf zu wenig) change the plan only
 *    on a PATTERN: 2 of 3 signals on the same day, sleep short on 3 of the last
 *    5 mornings, or Wochenrückblick "meist zu wenig". Single outliers → tip only.
 *    Ja/Nein influence drill choice only after ≥ 3 ratings (average);
 *    "Zu schwer" swaps to the easier variant immediately.
 * 6. Calibration: first 21 days conservative (Zusatz cap −1 → max 2, −20 %),
 *    personal normal Anstrengung is learned per day type.
 * 7. Growth > 7 cm/year → max 1 impact drill per session, 30 % shorter.
 * 8. Food: max 2 "Davon darf es mehr sein" tips from ≥ 3 logged days.
 */
var Engine = (function () {
  'use strict';
  var DAY_NAMES = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

    var title = ev ? (ev.kind === 'turnier' ? 'Turnier' : 'Spiel') : 'Training', time = ev ? (ev.meet || ev.time) : tr ? tr.time : null;
    var dur = ev ? Math.max(90, ev.dur + 30 + (ev.meet && ev.time ? Math.max(0, toMin(ev.time) - toMin(ev.meet)) : 0)) : 90;
    function toMin(x) { var a = String(x).split(':'); return (+a[0]) * 60 + (+a[1] || 0); }
    function p2(n) { return ('0' + n).slice(-2); }
